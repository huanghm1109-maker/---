<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Supabase configuration flow</title>
  <desc id="desc">Five steps from creating a Supabase account to starting the Streamlit app.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fff9"/>
      <stop offset="1" stop-color="#ecf8f1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <text x="600" y="55" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#173b2c">Supabase 配置路线</text>
  <g font-family="Segoe UI, sans-serif" text-anchor="middle">
    <g>
      <rect x="35" y="105" width="200" height="150" rx="18" fill="#ffffff" stroke="#3ecf8e" stroke-width="2"/>
      <circle cx="135" cy="150" r="24" fill="#3ecf8e"/>
      <text x="135" y="158" font-size="22" font-weight="700" fill="#ffffff">1</text>
      <text x="135" y="200" font-size="18" font-weight="700" fill="#183b2d">注册 Supabase</text>
      <text x="135" y="230" font-size="14" fill="#52665d">使用邮箱创建账号</text>
    </g>
    <path d="M245 180 H295" stroke="#2c7a58" stroke-width="4"/>
    <path d="M285 169 L299 180 L285 191" fill="none" stroke="#2c7a58" stroke-width="4"/>
    <g>
      <rect x="310" y="105" width="200" height="150" rx="18" fill="#ffffff" stroke="#3ecf8e" stroke-width="2"/>
      <circle cx="410" cy="150" r="24" fill="#3ecf8e"/>
      <text x="410" y="158" font-size="22" font-weight="700" fill="#ffffff">2</text>
      <text x="410" y="200" font-size="18" font-weight="700" fill="#183b2d">新建项目</text>
      <text x="410" y="230" font-size="14" fill="#52665d">保存数据库密码</text>
    </g>
    <path d="M520 180 H570" stroke="#2c7a58" stroke-width="4"/>
    <path d="M560 169 L574 180 L560 191" fill="none" stroke="#2c7a58" stroke-width="4"/>
    <g>
      <rect x="585" y="105" width="200" height="150" rx="18" fill="#ffffff" stroke="#3ecf8e" stroke-width="2"/>
      <circle cx="685" cy="150" r="24" fill="#3ecf8e"/>
      <text x="685" y="158" font-size="22" font-weight="700" fill="#ffffff">3</text>
      <text x="685" y="200" font-size="18" font-weight="700" fill="#183b2d">运行建表 SQL</text>
      <text x="685" y="230" font-size="14" fill="#52665d">SQL Editor 中执行</text>
    </g>
    <path d="M795 180 H845" stroke="#2c7a58" stroke-width="4"/>
    <path d="M835 169 L849 180 L835 191" fill="none" stroke="#2c7a58" stroke-width="4"/>
    <g>
      <rect x="860" y="105" width="200" height="150" rx="18" fill="#ffffff" stroke="#3ecf8e" stroke-width="2"/>
      <circle cx="960" cy="150" r="24" fill="#3ecf8e"/>
      <text x="960" y="158" font-size="22" font-weight="700" fill="#ffffff">4</text>
      <text x="960" y="200" font-size="18" font-weight="700" fill="#183b2d">复制连接串</text>
      <text x="960" y="230" font-size="14" fill="#52665d">Database URI</text>
    </g>
    <path d="M1070 180 H1115" stroke="#2c7a58" stroke-width="4"/>
    <path d="M1105 169 L1119 180 L1105 191" fill="none" stroke="#2c7a58" stroke-width="4"/>
    <g>
      <rect x="1010" y="275" width="160" height="55" rx="16" fill="#173b2c"/>
      <text x="1090" y="309" font-size="16" font-weight="700" fill="#ffffff">5. 填写 secrets</text>
    </g>
    <path d="M960 255 V292 H1010" fill="none" stroke="#2c7a58" stroke-width="4"/>
    <path d="M1000 281 L1014 292 L1000 303" fill="none" stroke="#2c7a58" stroke-width="4"/>
  </g>
</svg>
